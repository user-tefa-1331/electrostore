
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroStore - Tienda Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ElectroStore - La mejor tecnología</h1>
    <p>Tu tienda de confianza en productos electrónicos.</p>

    <h2>Nuestros productos</h2>

    <!-- Los productos se cargarán desde MySQL -->
    <div class="catalogo" id="catalogo-productos">
        <p>Cargando productos...</p>
    </div>

    <h2>Contáctanos</h2>
    <p>Encuentra la mejor tecnología al mejor precio.</p>

    <section class="carrito">
        <h2>🛒 Mi carrito de compras</h2>
        <ul id="lista-carrito"></ul>
        <h3>Total: S/ <span id="total">0.00</span></h3>
        <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
